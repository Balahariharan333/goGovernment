name: go_government
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  flutter_bloc: ^8.1.3
  equatable: ^2.1.0
  mobile_scanner: ^7.4.0
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/medicines/
    - assets/images/groceries/

  fonts:
    - family: Valley Sans
      fonts:
        - asset: assets/fonts/ValleySans-Regular.ttf
        - asset: assets/fonts/ValleySans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ValleySans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ValleySans-Bold.ttf
          weight: 700
